<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="280">
  <rect width="700" height="320" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Support Vector Machine (SVM): Maximum Margin Classifier</text>
  
  <!-- Hyperplane Lines -->
  <!-- Positive Margin w^T x + b = +1 -->
  <line x1="120" y1="260" x2="520" y2="60" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="470" y="55" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">wᵀx + b = +1</text>

  <!-- Decision Boundary w^T x + b = 0 -->
  <line x1="170" y1="280" x2="570" y2="80" stroke="#0f172a" stroke-width="3"/>
  <text x="580" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">wᵀx + b = 0 (Decision Boundary)</text>

  <!-- Negative Margin w^T x + b = -1 -->
  <line x1="220" y1="300" x2="620" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="590" y="115" font-family="sans-serif" font-size="11" font-weight="bold" fill="#dc2626">wᵀx + b = -1</text>

  <!-- Margin Distance Indicator -->
  <line x1="320" y1="160" x2="420" y2="200" stroke="#10b981" stroke-width="2"/>
  <polygon points="325,157 318,159 323,165" fill="#10b981"/>
  <polygon points="415,195 422,201 417,203" fill="#10b981"/>
  <text x="315" y="200" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857">Margin = 2 / ‖w‖</text>

  <!-- Class +1 Points (Blue) -->
  <circle cx="200" cy="110" r="6" fill="#3b82f6"/>
  <circle cx="240" cy="90" r="6" fill="#3b82f6"/>
  <circle cx="170" cy="160" r="6" fill="#3b82f6"/>
  <circle cx="280" cy="80" r="6" fill="#3b82f6"/>
  <!-- Support Vectors on positive margin -->
  <circle cx="260" cy="190" r="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="260" cy="190" r="5" fill="#3b82f6"/>
  <circle cx="360" cy="140" r="8" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="360" cy="140" r="5" fill="#3b82f6"/>
  <text x="210" y="215" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#2563eb">Support Vector</text>

  <!-- Class -1 Points (Red) -->
  <circle cx="480" cy="240" r="6" fill="#ef4444"/>
  <circle cx="520" cy="220" r="6" fill="#ef4444"/>
  <circle cx="550" cy="190" r="6" fill="#ef4444"/>
  <circle cx="420" cy="280" r="6" fill="#ef4444"/>
  <!-- Support Vector on negative margin -->
  <circle cx="460" cy="180" r="8" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="460" cy="180" r="5" fill="#ef4444"/>
  <text x="475" y="185" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#dc2626">Support Vector</text>

  <!-- Math Note Box -->
  <rect x="50" y="45" width="200" height="55" fill="#ffffff" rx="4" stroke="#cbd5e1"/>
  <text x="60" y="65" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e3a8a">Optimization Objective:</text>
  <text x="60" y="80" font-family="sans-serif" font-size="10" fill="#334155">min ½‖w‖² + C ∑ ξᵢ</text>
  <text x="60" y="93" font-family="sans-serif" font-size="9" fill="#64748b">s.t. yᵢ(wᵀxᵢ + b) ≥ 1 - ξᵢ</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="260">
  <rect width="720" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Classification Evaluation: Confusion Matrix & ROC Curve</text>
  
  <!-- Left: Confusion Matrix Grid -->
  <text x="70" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">2×2 Confusion Matrix</text>
  <g transform="translate(60, 70)">
    <rect x="50" y="25" width="80" height="60" fill="#dcfce7" stroke="#86efac"/>
    <text x="75" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">TP</text>
    <text x="60" y="70" font-family="sans-serif" font-size="9" fill="#166534">Hit (True Pos)</text>

    <rect x="130" y="25" width="80" height="60" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="155" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">FN</text>
    <text x="140" y="70" font-family="sans-serif" font-size="9" fill="#991b1b">Miss (Type II)</text>

    <rect x="50" y="85" width="80" height="60" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="75" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">FP</text>
    <text x="56" y="130" font-family="sans-serif" font-size="9" fill="#991b1b">False Alarm (Type I)</text>

    <rect x="130" y="85" width="80" height="60" fill="#dcfce7" stroke="#86efac"/>
    <text x="155" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#166534">TN</text>
    <text x="140" y="130" font-family="sans-serif" font-size="9" fill="#166534">Correct Rejection</text>

    <!-- Labels -->
    <text x="75" y="18" font-family="sans-serif" font-size="10" font-weight="bold">Pred: 1</text>
    <text x="155" y="18" font-family="sans-serif" font-size="10" font-weight="bold">Pred: 0</text>
    <text x="5" y="60" font-family="sans-serif" font-size="10" font-weight="bold">Act: 1</text>
    <text x="5" y="120" font-family="sans-serif" font-size="10" font-weight="bold">Act: 0</text>
  </g>

  <!-- Right: ROC Curve -->
  <text x="430" y="55" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155">ROC Curve (TPR vs. FPR)</text>
  <g transform="translate(400, 65)">
    <rect x="20" y="10" width="180" height="150" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Diagonal Random Line -->
    <line x1="20" y1="160" x2="200" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="110" y="95" font-family="sans-serif" font-size="9" fill="#64748b">Random (AUC=0.5)</text>

    <!-- Classifier Curve -->
    <path d="M 20,160 Q 30,30 200,10" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="60" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">AUC = 0.92</text>

    <text x="70" y="175" font-family="sans-serif" font-size="10" fill="#334155">FPR (1 - Specificity)</text>
    <text x="-5" y="10" font-family="sans-serif" font-size="10" fill="#334155">TPR</text>
  </g>
</svg>
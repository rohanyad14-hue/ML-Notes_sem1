<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="260">
  <rect width="700" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="210" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Decision Tree Splitting & Impurity Reduction</text>
  
  <!-- Root Node -->
  <rect x="270" y="45" width="160" height="42" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="282" y="63" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">Root: Age ≤ 45?</text>
  <text x="282" y="78" font-family="sans-serif" font-size="9.5" fill="#dbeafe">Gini = 0.48, N = 100</text>

  <!-- Level 1 Branches -->
  <line x1="320" y1="87" x2="190" y2="135" stroke="#64748b" stroke-width="2"/>
  <text x="220" y="110" font-family="sans-serif" font-size="11" font-weight="bold" fill="#047857">Yes</text>
  <line x1="380" y1="87" x2="510" y2="135" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="110" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">No</text>

  <!-- Left Child -->
  <rect x="110" y="135" width="160" height="42" rx="6" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="153" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Income ≤ $50k?</text>
  <text x="120" y="168" font-family="sans-serif" font-size="9.5" fill="#eff6ff">Gini = 0.32, N = 60</text>

  <!-- Right Leaf -->
  <rect x="440" y="135" width="140" height="42" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="450" y="153" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff">Leaf: Class B</text>
  <text x="450" y="168" font-family="sans-serif" font-size="9.5" fill="#fee2e2">Pure: Gini = 0.0, N = 40</text>

  <!-- Level 2 Branches -->
  <line x1="160" y1="177" x2="100" y2="215" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="177" x2="270" y2="215" stroke="#64748b" stroke-width="2"/>

  <!-- Left-Left Leaf -->
  <rect x="40" y="215" width="130" height="40" rx="6" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <text x="50" y="233" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Leaf: Class A</text>
  <text x="50" y="247" font-family="sans-serif" font-size="9.5" fill="#d1fae5">Gini = 0.05, N = 35</text>

  <!-- Left-Right Leaf -->
  <rect x="210" y="215" width="130" height="40" rx="6" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="220" y="233" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Leaf: Class B</text>
  <text x="220" y="247" font-family="sans-serif" font-size="9.5" fill="#fee2e2">Gini = 0.12, N = 25</text>

  <!-- Information Gain Formula Box -->
  <rect x="440" y="200" width="230" height="60" fill="#ffffff" rx="4" stroke="#cbd5e1"/>
  <text x="450" y="220" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#1e3a8a">Information Gain (IG):</text>
  <text x="450" y="236" font-family="sans-serif" font-size="9.5" fill="#334155">IG(S, A) = H(S) - ∑ (|Sᵥ|/|S|) H(Sᵥ)</text>
  <text x="450" y="250" font-family="sans-serif" font-size="9.5" fill="#64748b">Gini = 1 - ∑ pᵢ²</text>
</svg>
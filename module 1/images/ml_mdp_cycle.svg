<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="260">
  <rect width="700" height="280" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Reinforcement Learning: Agent-Environment Interface (MDP)</text>
  
  <!-- Agent Box -->
  <rect x="90" y="90" width="160" height="90" rx="8" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="145" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">AGENT</text>
  <text x="110" y="152" font-family="sans-serif" font-size="10.5" fill="#dbeafe">Policy π(a|s), Q-Table</text>

  <!-- Environment Box -->
  <rect x="450" y="90" width="160" height="90" rx="8" fill="#10b981" stroke="#047857" stroke-width="2"/>
  <text x="475" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">ENVIRONMENT</text>
  <text x="475" y="152" font-family="sans-serif" font-size="10.5" fill="#d1fae5">Dynamics P(s'|s,a), R(s,a)</text>

  <!-- Action Arrow (Agent -> Environment) -->
  <path d="M 250,110 C 330,65 370,65 450,110" fill="none" stroke="#dc2626" stroke-width="3"/>
  <polygon points="445,103 452,112 441,114" fill="#dc2626"/>
  <text x="325" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Action (Aₜ)</text>

  <!-- Reward & Next State Arrow (Environment -> Agent) -->
  <path d="M 450,160 C 370,205 330,205 250,160" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polygon points="255,167 248,158 259,156" fill="#2563eb"/>
  <text x="300" y="215" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Reward (Rₜ₊₁) & State (Sₜ₊₁)</text>

  <!-- Bellman Equation Box -->
  <rect x="180" y="235" width="340" height="35" fill="#eff6ff" rx="4" stroke="#93c5fd"/>
  <text x="195" y="257" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Q-Update: Q(s,a) ← Q(s,a) + α[R + γ max Q(s',a') - Q(s,a)]</text>
</svg>